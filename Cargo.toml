[package]
name = "cemi"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
description = "Secrets with memory that your AI can use without seeing"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/hamador0016/cemi"
homepage = "https://github.com/hamador0016/cemi"
# Only what builds and documents cemi goes to crates.io.
include = [
    "/src/**/*",
    "/presets/**/*",
    "/docs/**/*",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/README.es.md",
    "/SECURITY.md",
]
keywords = ["secrets", "vault", "mcp", "age", "env"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "cemi"
path = "src/main.rs"

[dependencies]
age = { version = "0.12", features = ["armor"] }
aho-corasick = "1"
anyhow = "1"
argon2 = "0.6"
arboard = { version = "3", default-features = false }
chacha20poly1305 = "0.10"
clap = { version = "4.6", features = ["derive", "env"] }
ctrlc = "3"
data-encoding = "2"
getrandom = "0.3"
ignore = "0.4"
jiff = { version = "0.2", features = ["serde"] }
keyring = { version = "3.6", features = ["windows-native", "apple-native", "linux-native"] }
rmcp = { version = "3.9", features = ["server", "transport-io", "macros"] }
rpassword = "7"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
hmac = "0.12"
bech32 = "0.11"
sha2 = "0.10"
tempfile = "3"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process", "io-util"] }
toml = "0.9"
toml_edit = "0.23"
zeroize = { version = "1.9", features = ["serde"] }
crypto_box = { version = "0.9", features = ["seal"] }
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
dialoguer = { version = "0.12.0", default-features = false, features = ["fuzzy-select"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
