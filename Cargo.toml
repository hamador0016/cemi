[package]
name = "cemi"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Secrets with memory that your AI can use without seeing"
license = "Apache-2.0"
readme = "README.md"
keywords = ["secrets", "vault", "mcp", "age", "env"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "cemi"
path = "src/main.rs"

[dependencies]
age = "0.12"
aho-corasick = "1"
anyhow = "1"
argon2 = "0.6"
arboard = { version = "3", default-features = false }
chacha20poly1305 = "0.10"
clap = { version = "4.6", features = ["derive", "env"] }
ctrlc = "3"
data-encoding = "2"
getrandom = "0.3"
ignore = "0.4"
jiff = { version = "0.2", features = ["serde"] }
keyring = { version = "3.6", features = ["windows-native", "apple-native", "linux-native"] }
rmcp = { version = "3.9", features = ["server", "transport-io", "macros"] }
rpassword = "7"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process", "io-util"] }
toml = "0.9"
toml_edit = "0.23"
zeroize = { version = "1.9", features = ["serde"] }
crypto_box = { version = "0.9", features = ["seal"] }
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
