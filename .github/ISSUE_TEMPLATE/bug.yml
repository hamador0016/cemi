name: Bug
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a secret value, a token or a recovery code here.** Names of records and
        fields are fine; values are not. Security problems go to the private report instead
        (Security tab → Report a vulnerability).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and what it printed (remove any value first).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cemi --version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
