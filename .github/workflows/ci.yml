name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
      - name: Syntax
        run: for f in editors/vscode/extension.js editors/vscode/src/*.js; do node --check "$f"; done
      - name: Tests
        run: node --test editors/vscode/test/*.test.js
      - name: Package
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce@4.1.0 package -o cemi-vscode.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cemi-vscode
          path: editors/vscode/cemi-vscode.vsix
          retention-days: 30

  licenses:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, x86_64-unknown-linux-gnu, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --target ${{ matrix.target }}

  secrets:
    name: No secrets in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  action:
    name: The GitHub action loads CI secrets
    runs-on: ubuntu-latest
    env:
      CEMI_HOME: ${{ github.workspace }}/../cemi-home
      CEMI_TEST_SESSION_DIR: ${{ github.workspace }}/../cemi-sessions
      CEMI_INSECURE_FAST_KDF: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build cemi
        run: |
          cargo build
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - name: A project with a CI file
        id: project
        run: |
          mkdir -p ../project && cd ../project
          printf 'a test password for ci\n' | cemi --password-stdin init --global > /dev/null
          cemi init
          cemi add api
          cemi field add api token --secret
          printf 'value-for-the-action-test' | cemi set api#token -e prod --stdin
          cemi var add API_TOKEN api#token
          cemi ci setup
          printf 'a test password for ci\n' | cemi --password-stdin ci export -e prod
          key=$(printf 'a test password for ci\n' | cemi --password-stdin reveal cemi-ci#key)
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "dir=$PWD" >> "$GITHUB_OUTPUT"
      - uses: ./
        with:
          key: ${{ steps.project.outputs.key }}
          working-directory: ${{ steps.project.outputs.dir }}
      - name: The next steps have the value
        run: test "$API_TOKEN" = "value-for-the-action-test"
