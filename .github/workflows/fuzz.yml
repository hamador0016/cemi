# Fuzzing: random input against everything Cemí reads from outside (.env
# files, cemi.toml, references, vault and share files, proxy paths). One
# minute per target on every push to main, ten every week. A crash keeps the
# input that caused it as an artifact.
name: Fuzz

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [references, dotenv, project_file, vault_files, share_file, proxy_paths]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-25
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz
        env:
          SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && '600' || '60' }}
        run: |
          rm -f rust-toolchain.toml
          cargo +nightly-2026-10-25 fuzz run ${{ matrix.target }} -- -max_total_time=$SECONDS_PER_TARGET -rss_limit_mb=4096
      - name: Keep the input that crashed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts
